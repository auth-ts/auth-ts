cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'nx@23.3.0'
  - '@nx/nx-darwin-x64@23.3.0'
  - '@nx/nx-freebsd-x64@23.3.0'
  - '@nx/nx-darwin-arm64@23.3.0'
  - '@nx/nx-linux-x64-gnu@23.3.0'
  - '@nx/nx-linux-x64-musl@23.3.0'
  - '@nx/nx-win32-x64-msvc@23.3.0'
  - '@nx/nx-linux-arm64-gnu@23.3.0'
  - '@nx/nx-linux-arm64-musl@23.3.0'
  - '@nx/nx-win32-arm64-msvc@23.3.0'
  - '@nx/nx-linux-arm-gnueabihf@23.3.0'
  - '@supabase/supabase-js@2.117.3'
  - '@supabase/auth-js@2.117.3'
  - '@supabase/storage-js@2.117.3'
  - '@supabase/realtime-js@2.117.3'
  - '@supabase/functions-js@2.117.3'
  - '@supabase/postgrest-js@2.117.3'
  - 'lefthook@2.2.0'
  - 'lefthook-linux-x64@2.2.0'
  - 'lefthook-darwin-x64@2.2.0'
  - 'lefthook-freebsd-x64@2.2.0'
  - 'lefthook-linux-arm64@2.2.0'
  - 'lefthook-openbsd-x64@2.2.0'
  - 'lefthook-windows-x64@2.2.0'
  - 'lefthook-darwin-arm64@2.2.0'
  - 'lefthook-freebsd-arm64@2.2.0'
  - 'lefthook-openbsd-arm64@2.2.0'
  - 'lefthook-windows-arm64@2.2.0'
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'semver@6.3.1' # Babel via @nx/js

packages:
  - packages/*
  - apps/*
  - examples/*/*

allowBuilds:
  nx: true
  lefthook: true
  esbuild: true
  workerd: true
  core-js-pure: false

# Align Neon and cache-helper client types.
overrides:
  '@supabase/postgrest-js': 2.117.3
  'nx>undici': 7.30.0
  'miniflare>sharp': 0.35.5
