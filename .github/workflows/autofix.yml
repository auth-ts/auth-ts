# autofix.ci: runs the formatter on every PR and pushes the resulting diff back
# to the PR branch as a commit, so a contributor who forgot to run biome does
# not have to round-trip on a red check. The workflow and its `name:` must both
# be `autofix.ci`/`autofix.yml` — the autofix.ci app looks them up by name.
name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

# The job itself never writes to the repo. The autofix-ci action uploads the
# working-tree diff to autofix.ci, and the autofix.ci GitHub App (installed on
# the org) is what commits it back — so this token stays read-only even on
# pull requests from forks.
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, same as ci.yml. autofix.ci additionally requires
      # its own action to be SHA-pinned and refuses to run otherwise.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Same command the lefthook pre-commit hook and `bun run format` use, so
      # the three can never disagree about what "formatted" means.
      - run: bun run format

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
