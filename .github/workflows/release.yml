name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Read-only: this job publishes to npm and touches nothing in the
      # repository. Versioning, tagging, and the changelog happen locally via
      # `nx release`, and the tag push is what triggers this. If a step is ever
      # added that creates a GitHub release, that step needs contents: write —
      # give it its own job rather than widening this one.
      contents: read
      # Required for npm provenance, which links the published package to this
      # workflow run so consumers can verify where it came from.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Publishing uses NPM_TOKEN, never the git remote, so the job's token
          # has no reason to persist into .git/config.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          # Download Bun rather than restoring it from the Actions cache. This
          # is the toolchain that builds and signs what gets published, and the
          # cache is mutable storage a compromised workflow could write to. One
          # extra download per release is a fair price for that.
          no-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Build from source at the tagged commit, never from the cache. The Nx
      # cache is remote now, so a cache hit would publish artifacts this run did
      # not produce — while npm provenance attests that it did.
      - run: bun x nx run-many -t build --projects='packages/*' --skip-nx-cache

      - name: Publish
        run: bun x nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
