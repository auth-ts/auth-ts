name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas queries the workflow run history through the API to find the
  # last successful commit on main, which needs read access to actions. Without
  # it, `nx affected` loses its base and silently treats everything as affected.
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # owns the action can repoint v4 at new code, and it would run here with
      # our token and our checkout. The trailing comment is the released
      # version the SHA belongs to, so updates stay reviewable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nx compares against the base commit to decide what is affected.
          fetch-depth: 0
          # Do not leave the job's token in .git/config, where any later step —
          # including anything that runs during dependency installation — could
          # read it and push with it.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run lint

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Test and build affected projects
        run: pnpm run test:pr
